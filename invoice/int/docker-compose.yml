services:
  invoice_int:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_int
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Mount folder project supaya app.py & template xlsx bisa diedit
      # tanpa perlu rebuild image tiap kali ganti isi file.
      - ./:/app
    restart: unless-stopped
